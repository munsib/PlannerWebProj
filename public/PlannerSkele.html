<!DOCTYPE html>
<html>
<head>
  <title>Planner</title>
  <link rel="stylesheet" href="styles/style.css">
</head>

<body class="page page--planner">

<nav>
  <a href="register.html">Register</a>
  <a href="login.html">Login</a>
  <a href="PlannerSkele.html">Planner</a>
</nav>

<main>
  <h1>Planner Items</h1>
  <p>Add a task or study session.</p>
  <p id="plannerWelcome"></p>

  <img
    class="hero-image"
    src="images/phil-garrison-4frahBgwUEA-unsplash.jpg"
    alt="Alien"
    width="300"
  >

  <form id="plannerForm">

    <label>Title</label>
    <input id="plannerTitle" type="text">

    <label>Description</label>
    <textarea id="plannerDescription"></textarea>

    <label>Item Type</label>
    <input id="plannerType" type="text" value="study session">

    <label>Due Date</label>
    <input id="plannerDueDate" type="date">

    <input type="submit" value="Add Item">

    <p id="plannerMessage"></p>

  </form>

  <button id="logoutButton" type="button">Logout</button>

  <section>
    <h2>Last Created Item</h2>
    <pre id="plannerOutput">No planner item has been created yet.</pre>
  </section>

  <h2>Example Items</h2>
  <ul>
    <li>Study for Digital Logic quiz</li>
    <li>Finish lab report</li>
    <li>Plan circuits study session</li>
  </ul>

</main>

<script src="planner.js"></script>

</body>
</html>
